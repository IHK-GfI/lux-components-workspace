name: e2e (Playwright)

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'projects/lux-components-lib/**'
      - 'projects/lux-components-theme/**'
      - 'projects/demo-app/**'
      - 'e2e/**'
  workflow_dispatch:

# Alle Jobs laufen im offiziellen Playwright-Image. Der Tag muss exakt zur Version von
# @playwright/test in e2e/package.json passen, sonst weichen die Screenshots von den
# lokal (per podman) erzeugten Baselines ab.

jobs:
  # Theme, Lib und Demo nur einmal bauen und an die Test-Shards weitergeben.
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: |
          npm install
          npm run vrt:build
      - uses: actions/upload-artifact@v7
        with:
          name: demo-app
          path: dist/demo-app/browser
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: demo-app
          path: dist/demo-app/browser
      - working-directory: e2e
        run: |
          npm ci
          npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1

  # Nur bei Fehlern: Blob-Reports der Shards zu einem HTML-Report (inkl. Diff-Bildern und Traces) zusammenführen.
  report:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - working-directory: e2e
        run: |
          npm ci
          npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
