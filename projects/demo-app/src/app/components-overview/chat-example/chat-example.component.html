<example-base-structure
  exampleTitle="Chat"
  exampleDocumentationHref="https://github.com/IHK-GfI/lux-components-workspace/wiki/lux%E2%80%90chat-v21"
>
  <example-base-content>
    @if (!showChatPopup()) {
      <div style="height: calc(100vh - 270px)">
        <lux-chat [luxChatData]="chatData" [luxChatUserName]="exampleUsername()" (luxChatOutput)="onMessageEntered($event)">
          @if (showCustomHeader()) {
            <lux-chat-header>
              <ng-template>Custom Header {{ chatData.title }} </ng-template>
            </lux-chat-header>
          }
        </lux-chat>
      </div>
    }

    @if (showChatPopup()) {
      <lux-chat-popup>
        <lux-chat [luxChatData]="chatData" [luxChatUserName]="exampleUsername()" (luxChatOutput)="onMessageEntered($event)">
          @if (showCustomHeader()) {
            <lux-chat-header>
              <ng-template>Custom Header {{ chatData.title }} </ng-template>
            </lux-chat-header>
          }
        </lux-chat>
      </lux-chat-popup>
    }
  </example-base-content>

  <example-base-simple-options>
    <lux-input luxLabel="Chat Titel" [value]="chatData.title" (valueChange)="onChatTitleChange($event)" />
    <lux-input luxLabel="Chat Username" [(value)]="exampleUsername" />

    <lux-toggle luxLabel="Zeige Chat in LuxChatPopup Komponente" [(checked)]="showChatPopup" />
    <lux-toggle luxLabel="Custom Chat Header anzeigen" [(checked)]="showCustomHeader" />
  </example-base-simple-options>
</example-base-structure>
