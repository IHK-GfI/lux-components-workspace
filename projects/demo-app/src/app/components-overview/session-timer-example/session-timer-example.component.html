<example-base-structure
  exampleTitle="Session-Timer"
  exampleDocumentationHref="https://github.com/IHK-GfI/lux-components-workspace/wiki/lux%E2%80%90session%E2%80%90timer-v22"
>
  <example-base-simple-options class="lux-flex lux-flex-col lux-gap-4">
    Bei einer verbleibenden Session-Zeit von 2 minuten wird ein Dialog geöffnet, mit dem die Session verlängert oder beendet werden kann.
    Mit dem Button kann der Dialog manuell geöffnet werden.
    <lux-button luxLabel="Dialog öffnen" [luxFlat]="true" luxColor="primary" (luxClicked)="timerService.openDialog()" />
    <lux-toggle luxLabel="Session darf verlängert werden" luxColor="primary" [(checked)]="canExtendSession" />
    <div class="lux-mt-3"></div>
    <lux-input luxLabel="Startzeit der Session in Sekunden" [(value)]="startingSeconds" />
    <lux-button luxLabel="Zeit setzen" [luxFlat]="true" luxColor="primary" (luxClicked)="setTimer()" />
    <lux-button luxLabel="Timer zurücksetzen" [luxFlat]="true" luxColor="primary" (luxClicked)="timerService.clearTimer()" />
  </example-base-simple-options>
</example-base-structure>
