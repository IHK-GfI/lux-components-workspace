<example-base-structure
  exampleTitle="Quill"
  exampleDocumentationHref="https://github.com/IHK-GfI/lux-components-workspace/wiki/lux%E2%80%90quill-v22"
>
  <example-base-content>
    <div class="lux-flex lux-flex-col">
      <h3>Signal Form &mdash; <code>[formField]</code></h3>
      <lux-quill
        luxTagId="quill_signalForm"
        [formField]="signalForm.quillValue"
        [luxLabel]="label()"
        [luxHint]="hint()"
        [luxPlaceholder]="placeholder()"
        [luxErrorMessage]="errorMessage() || undefined"
        [luxDense]="dense()"
        [luxNoTopLabel]="noTopLabel()"
        [luxNoBottomLabel]="noBottomLabel()"
        [luxMinHeight]="minHeight() || undefined"
        [luxMaxHeight]="maxHeight() || undefined"
        [luxPreset]="preset()"
        [luxConfig]="config()"
      />
      <example-signal-form-value [field]="signalForm.quillValue" />
    </div>

    <div class="lux-flex lux-flex-col" [formGroup]="form">
      <h3>Reactive-Form &mdash; <code>formControlName</code></h3>
      <lux-quill
        luxTagId="quill_withForm"
        [formControlName]="controlBinding"
        [(luxDisabled)]="disabled"
        [luxLabel]="label()"
        [luxHint]="hint()"
        [luxPlaceholder]="placeholder()"
        [luxErrorMessage]="errorMessage() || undefined"
        [readonly]="readonly()"
        [luxDense]="dense()"
        [luxNoTopLabel]="noTopLabel()"
        [luxNoBottomLabel]="noBottomLabel()"
        [luxMinHeight]="minHeight() || undefined"
        [luxMaxHeight]="maxHeight() || undefined"
        [luxPreset]="preset()"
        [luxConfig]="config()"
      ></lux-quill>
      <example-form-value [form]="form" [controlBinding]="controlBinding"></example-form-value>
    </div>

    <div class="lux-flex lux-flex-col">
      <h3>Freistehend &mdash; <code>[(value)]</code></h3>
      <lux-quill
        luxTagId="quill_withoutForm"
        [(value)]="value"
        [luxLabel]="label()"
        [luxHint]="hint()"
        [luxPlaceholder]="placeholder()"
        [luxErrorMessage]="errorMessage() || undefined"
        [luxRequired]="required()"
        [readonly]="readonly()"
        [(luxDisabled)]="disabled"
        [luxDense]="dense()"
        [luxNoTopLabel]="noTopLabel()"
        [luxNoBottomLabel]="noBottomLabel()"
        [luxMinHeight]="minHeight() || undefined"
        [luxMaxHeight]="maxHeight() || undefined"
        [luxPreset]="preset()"
        [luxConfig]="config()"
        (luxFocusIn)="log(showOutputEvents(), 'luxFocusIn', $event)"
        (luxFocusOut)="log(showOutputEvents(), 'luxFocusOut', $event)"
        (valueChange)="log(showOutputEvents(), 'valueChange', $event)"
        (luxEditorCreated)="log(showOutputEvents(), 'luxEditorCreated', $event)"
      ></lux-quill>
      <example-value [value]="value()"></example-value>
    </div>

    <div class="lux-flex lux-flex-col">
      <h3>Ausgabe mit lux-html</h3>
      <lux-html [luxData]="value()" luxClass="lux-quill-content" [luxSanitizeConfig]="{ addAllowedAttrs: ['target'] }"></lux-html>
    </div>
  </example-base-content>

  <example-base-simple-options class="lux-flex lux-flex-col lux-gap-4">
    <div class="lux-hint lux-p-2">
      Tastatur im Editor: Tab / Umschalt+Tab rückt ein bzw. aus, Escape und dann Tab verlässt den Editor. Strg+B/I/U formatiert, Strg+K fügt
      einen Link ein. In der Toolbar navigieren die Pfeiltasten.
    </div>
    <lux-toggle
      luxLabel="Output-Events loggen"
      luxHint="(Console --> F12/CMD+ALT+I)"
      [(checked)]="showOutputEvents"
      [luxNoTopLabel]="true"
    ></lux-toggle>
    <lux-select
      luxLabel="luxPreset"
      luxHint="comment: ohne Überschriften (z. B. Kommentare). document: Textstil-Auswahl mit echten Überschriften (h1/h2) für Briefe/PDF."
      [luxOptions]="presetOptions"
      luxOptionLabelProp="label"
      [luxPickValue]="(item) => item.value"
      [(value)]="preset"
    ></lux-select>
    <lux-select
      luxLabel="luxConfig.headingMode"
      luxHint="Überschreibt das Preset. none: keine Überschriften, visual: nur Optik (Absatz mit Überschriften-Klasse), semantic: echte h-Tags. Vorhandene Überschriften werden beim Wechsel umgewandelt."
      [luxOptions]="headingModeOptions"
      luxOptionLabelProp="label"
      [luxPickValue]="(item) => item.value"
      [(value)]="headingMode"
    ></lux-select>
    <lux-select
      luxLabel="luxConfig.headingLevels"
      luxHint="HTML-Ebenen für Überschrift 1 / 2, z. B. h2/h3 auf Seiten mit eigener h1. Wirkt nur bei semantic, die Optik bleibt gleich."
      [luxOptions]="headingLevelOptions"
      luxOptionLabelProp="label"
      [luxPickValue]="(item) => item.value"
      [(value)]="headingLevels"
    ></lux-select>
    <lux-input luxLabel="luxLabel" luxHint="Text oberhalb des Editors, zugleich sein zugänglicher Name." [(value)]="label"></lux-input>
    <lux-input
      luxLabel="luxHint"
      luxHint="Hinweis unterhalb des Editors (wird bei einem Fehler durch die Fehlermeldung ersetzt)."
      [(value)]="hint"
    ></lux-input>
    <lux-input
      luxLabel="luxPlaceholder"
      luxHint="Nur bei leerem Editor sichtbar – zum Testen den Inhalt löschen."
      [(value)]="placeholder"
    ></lux-input>
    <lux-toggle
      luxLabel="luxRequired"
      luxHint="Pflichtfeld (im Formular per Validators.required). Die Fehlermeldung erscheint erst, wenn man den leeren Editor verlässt."
      [(checked)]="required"
      [luxNoTopLabel]="true"
    ></lux-toggle>
    <lux-toggle
      luxLabel="readonly"
      luxHint="Schreibschutz: Toolbar wird ausgeblendet, der Inhalt bleibt per Tab erreichbar und lesbar."
      [(checked)]="readonly"
      [luxNoTopLabel]="true"
    ></lux-toggle>
    <example-form-disable [form]="form" [controlBinding]="controlBinding" [(disabled)]="disabled"></example-form-disable>
    <lux-toggle
      luxLabel="luxDense"
      luxHint="Kompaktere Darstellung (geringere Abstände und Mindesthöhe)."
      [(checked)]="dense"
      [luxNoTopLabel]="true"
    ></lux-toggle>
  </example-base-simple-options>

  <example-base-advanced-options class="lux-flex lux-flex-col lux-gap-4">
    <lux-select
      luxLabel="luxConfig.toolbar"
      luxHint="Einträge der Toolbar. Formate ohne Eintrag sind im Editor nicht erlaubt und werden aus dem Wert entfernt. Ohne indent/outdent wechselt Tab direkt den Fokus."
      [luxOptions]="toolbarOptions"
      [luxMultiple]="true"
      [(value)]="toolbar"
    ></lux-select>
    <lux-input
      luxLabel="luxErrorMessage"
      luxHint="Ersetzt die Standardfehlermeldung, z. B. bei leerem Pflichtfeld (luxRequired)."
      [(value)]="errorMessage"
    ></lux-input>
    <lux-input luxLabel="luxMinHeight" luxHint="Mindesthöhe des Eingabebereichs, z. B. 8rem." [(value)]="minHeight"></lux-input>
    <lux-input
      luxLabel="luxMaxHeight"
      luxHint="Längerer Inhalt scrollt innerhalb des Editors, z. B. 20rem."
      [(value)]="maxHeight"
    ></lux-input>
    <lux-toggle
      luxLabel="luxNoTopLabel"
      luxHint="Blendet das Label nur visuell aus, für Screenreader bleibt es erhalten."
      [(checked)]="noTopLabel"
      [luxNoTopLabel]="true"
    ></lux-toggle>
    <lux-toggle
      luxLabel="luxNoBottomLabel"
      luxHint="Entfernt Hinweis und Fehlermeldung unterhalb des Editors."
      [(checked)]="noBottomLabel"
      [luxNoTopLabel]="true"
    ></lux-toggle>
  </example-base-advanced-options>
</example-base-structure>
