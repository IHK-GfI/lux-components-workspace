<example-base-structure
  exampleTitle="Badge"
  exampleDocumentationHref="https://github.com/IHK-GfI/lux-components-workspace/wiki/lux%E2%80%90badge-v21"
>
  <example-base-content class="lux-flex lux-flex-col lux-gap-4" [ngStyle]="{ backgroundColor: backgroundColor() }">
    @for (color of colors; track color) {
      <div class="lux-min-height-12">
        <lux-badge [luxIconName]="iconName()" [luxColor]="color" [luxUppercase]="uppercase()" [luxMuted]="muted()" [luxSize]="size()">
          <lux-label [luxId]="'bsp-badge-label-' + color">
            {{ text() }}
          </lux-label>
        </lux-badge>
      </div>
    }
  </example-base-content>
  <example-base-simple-options class="lux-flex lux-flex-col lux-gap-4">
    <lux-input-ac
      luxLabel="luxIconName"
      luxHint="Diese Property definiert das Icon, welches in dem Badge angezeigt wird."
      [(luxValue)]="iconName"
    />
    <lux-input-ac
      luxLabel="Badge Text"
      luxHint="Der Text-Inhalt der Badge wird über Content-Projection mithilfe der lux-label Component eingebunden."
      [(luxValue)]="text"
    />
    <lux-input-ac luxName="button_background_Color" [(luxValue)]="backgroundColor" luxLabel="Hintergrundfarbe">
      <lux-form-hint>Kontrast zwischen Element und Hintergrund prüfen.</lux-form-hint>
    </lux-input-ac>
    <lux-select-ac
      luxLabel="luxSize"
      luxHint="Setzt die Schriftgröße des Badges. Ohne Angabe wird die Schriftgröße vom Parent-Element geerbt."
      [(luxSelected)]="size"
      [luxOptions]="sizeOptions"
      luxOptionLabelProp="label"
      [luxPickValue]="sizePickValue"
    />
    <lux-toggle-ac
      [(luxChecked)]="uppercase"
      luxLabel="luxUppercase"
      luxHint="Die Property ermöglicht eine Uppercase-Darstellung des Textes in der Badge einzuschalten."
      [luxNoTopLabel]="true"
    />
    <lux-toggle-ac
      [(luxChecked)]="muted"
      luxLabel="luxMuted"
      luxHint="Die Property aktiviert die Muted-Darstellung mit hellem Hintergrund und farbigem Rahmen."
      [luxNoTopLabel]="true"
    />
  </example-base-simple-options>
</example-base-structure>
