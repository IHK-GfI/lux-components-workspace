<div class="lux-container">
  <h2>1 Karte pro Zeile</h2>
  <lux-card luxTitle="Einstellungen" luxTagId="form1row">
    <lux-card-content>
      <div class="lux-grid lux-grid-cols-4 lt-md:lux-grid-cols-1 lux-col-gap-8 lux-row-gap-4">
        <lux-autocomplete
          [luxOptions]="salutations"
          luxLabel="Anrede"
          [luxLookupDelay]="100"
          [luxSelectAllOnClick]="true"
          [luxStrict]="false"
          [formField]="myForm.user.salutation"
        >
        </lux-autocomplete>
        <lux-input luxName="user" luxLabel="Name" [formField]="myForm.user.name" class="lux-row-start-2"></lux-input>
        <lux-input
          luxName="form-single_Alter"
          luxLabel="Alter"
          [formField]="myForm.user.age"
          luxType="number"
          [luxNumberAlignLeft]="true"
          class="lux-row-start-2"
        >
        </lux-input>
        <lux-input
          luxName="form-single_DeaktiviertesElement"
          luxLabel="Deaktiviertes Element"
          [formField]="myForm.user.deactivated"
          class="lux-row-start-2"
        >
        </lux-input>
        <lux-radio
          [luxOrientationVertical]="false"
          [luxOptions]="genders"
          [luxPickValue]="pickGenderValue"
          [formField]="myForm.user.gender"
          luxLabel="Geschlecht"
          class="lux-row-start-2"
        >
          <ng-template let-option>
            {{ option.name }}
          </ng-template>
        </lux-radio>

        <lux-input
          luxName="current-password"
          luxLabel="Passwort"
          luxType="password"
          [formField]="myForm.user.password"
          class="lux-row-start-3 lux-col-span-2"
        >
          <lux-input-suffix>
            <lux-icon luxIconName="lux-interface-lock"></lux-icon>
          </lux-input-suffix>
        </lux-input>

        <lux-input luxName="email" luxLabel="E-Mail" [formField]="myForm.user.email" class="lux-row-start-3 lux-col-span-2">
          <lux-input-suffix>
            <lux-icon luxIconName="lux-mail-sign-at"></lux-icon>
          </lux-input-suffix>
        </lux-input>

        <lux-autocomplete
          [luxOptions]="countries"
          luxOptionLabelProp="name"
          luxLabel="Land"
          [luxLookupDelay]="100"
          luxHint="Wählen Sie ein Land aus"
          [luxSelectAllOnClick]="false"
          [formField]="myForm.user.country"
          class="lux-row-start-4 lux-col-span-3"
        >
        </lux-autocomplete>
      </div>
      <div class="lux-grid lux-grid-cols-4 lt-md:lux-grid-cols-1 lux-col-gap-8 lux-row-gap-4 lux-mt-4">
        <lux-select
          luxLabel="Rollen auswählen"
          [luxOptions]="roles()"
          luxOptionLabelProp="name"
          luxOptionValueProp="name"
          [luxMultiple]="true"
          [formField]="myForm.roles"
          class="lux-col-span-full"
        ></lux-select>
        <lux-chips
          [luxInputAllowed]="true"
          luxInputLabel="Neue Rolle..."
          luxOrientation="horizontal"
          (luxChipAdded)="addRole($event)"
          class="lux-col-span-full"
        >
          @for (role of roles(); track role; let i = $index) {
            <lux-chip (luxChipRemoved)="removeRole(i)">
              {{ role.name }}
            </lux-chip>
          }
        </lux-chips>
        <lux-toggle luxLabel="EULA zugestimmt" [formField]="myForm.eula" class="lux-col-span-full"></lux-toggle>

        <lux-datepicker [formField]="myForm.date" luxLabel="Läuft ab am"></lux-datepicker>
      </div>
    </lux-card-content>
  </lux-card>

  <lux-card luxTitle="Formulardaten">
    <lux-card-content>
      <div>
        <pre>{{ model() | json }}</pre>
      </div>
    </lux-card-content>
  </lux-card>
</div>
