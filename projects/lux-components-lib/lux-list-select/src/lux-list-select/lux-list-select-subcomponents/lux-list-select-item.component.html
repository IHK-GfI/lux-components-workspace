<!-- Klick auf die Karte ist reine Komfort-Erweiterung; die Tastaturbedienung läuft über role="row" und den FocusKeyManager der Hauptkomponente. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  #card
  class="lux-list-select-card lux-flex lux-items-center lux-gap-4"
  role="row"
  tabindex="-1"
  [class.lux-list-select-size-small]="luxSize() === 'small'"
  [class.lux-list-select-size-xsmall]="luxSize() === 'xsmall'"
  [class.lux-selected]="luxSelected()"
  [class.lux-disabled]="luxDisabled()"
  [attr.aria-selected]="luxSelected()"
  [attr.aria-disabled]="luxDisabled() ? 'true' : null"
  (click)="onCardClick($event)"
>
  <div class="lux-list-select-control-cell lux-flex lux-items-center" role="gridcell">
    @if (luxMode() === 'multi') {
      <!-- aria-label bewusst ohne || null: MatCheckbox koalesziert intern selbst; aria-describedby braucht $any(), da der Material-Typ non-nullable ist. -->
      <mat-checkbox
        class="lux-list-select-control"
        [checked]="luxSelected()"
        [disabled]="luxDisabled()"
        [tabIndex]="-1"
        [aria-label]="luxTitle()"
        [aria-labelledby]="luxTitle() ? null : titleId"
        [aria-describedby]="$any(luxSubTitle() && !luxContentTemplate() ? subTitleId : null)"
        (change)="onControlChange()"
      ></mat-checkbox>
    } @else {
      <mat-radio-button
        class="lux-list-select-control"
        [value]="luxItem()"
        [checked]="luxSelected()"
        [disabled]="luxDisabled()"
        [tabIndex]="-1"
        [name]="luxRadioName()"
        [aria-label]="luxTitle() || null"
        [aria-labelledby]="luxTitle() ? null : titleId"
        [aria-describedby]="luxSubTitle() && !luxContentTemplate() ? subTitleId : null"
        [disableRipple]="true"
        color="primary"
        (change)="onControlChange()"
      ></mat-radio-button>
    }
  </div>
  <div class="lux-list-select-headlines lux-flex lux-flex-col lux-flex-auto" role="gridcell" [attr.id]="titleId">
    @if (luxContentTemplate()) {
      <ng-container *ngTemplateOutlet="luxContentTemplate(); context: { $implicit: luxItem(), selected: luxSelected() }"></ng-container>
    } @else {
      <span class="lux-list-select-title" [luxTooltip]="luxTitle()" [luxTooltipIfTruncated]="true">{{ luxTitle() }}</span>
      @if (luxSubTitle()) {
        <span class="lux-list-select-subtitle lux-leading-tight" [attr.id]="subTitleId" [luxTooltip]="luxSubTitle() ?? ''" [luxTooltipIfTruncated]="true">{{
          luxSubTitle()
        }}</span>
      }
    }
  </div>
  @if (luxShowDetailButton()) {
    <div class="lux-list-select-detail-cell lux-flex lux-items-center" role="gridcell">
      <lux-button
        class="lux-list-select-detail"
        [luxIconButton]="true"
        [luxIconName]="luxDetailIconName()"
        [luxLabel]="detailAriaLabel()"
        [luxDisabled]="luxDisabled()"
        (luxClicked)="luxDetail.emit()"
      ></lux-button>
    </div>
  }
</div>
