<div class="lux-datepicker-custom-header-component">
  <lux-button
    luxLabel="&lt;"
    [luxThrottleTime]="1"
    class="lux-datepicker-button lux-datepicker-prev-month"
    (luxClicked)="previousClicked()"
    luxAriaLabel="{{ ('luxc.datepicker.prev.' + navigationPeriod + '.arialabel') | transloco }}"
  ></lux-button>
  <lux-button luxLabel="{{ periodLabel }}" class="lux-datepicker-button lux-datepicker-year" (luxClicked)="currentPeriodClicked()"> </lux-button>
  <lux-button
    luxLabel="&gt;"
    [luxThrottleTime]="1"
    class="lux-datepicker-button lux-datepicker-next-month"
    (luxClicked)="nextClicked()"
    luxAriaLabel="{{ ('luxc.datepicker.next.' + navigationPeriod + '.arialabel') | transloco }}"
  ></lux-button>
</div>
