<lux-form-control-wrapper
  (click)="onWrapperClick($event)"
  [luxFormComponent]="this"
  [luxNoLabels]="luxNoLabels()"
  [luxNoBottomLabel]="luxNoBottomLabel()"
  [luxNoTopLabel]="luxNoTopLabel()"
  [luxCounterLabel]="counterLabel()"
  [luxHideCounterLabel]="luxHideCounterLabel()"
  [luxLabelLongFormat]="luxLabelLongFormat()"
  luxTagId="luxInputWrapper"
>
  <div class="lux-input-row-authentic">
    @if (inputPrefix()) {
      <span class="lux-input-prefix-container" [attr.aria-disabled]="isDisabled() ? 'true' : null" matPrefix>
        <ng-content select="lux-input-ac-prefix, lux-input-prefix" />
      </span>
    }
    <input
      matInput
      luxTagIdHandler
      [luxNameAttr]="luxName()"
      [luxTagId]="luxTagId()"
      [placeholder]="luxPlaceholder()"
      [type]="luxType()"
      [luxMaxLengthAttr]="luxMaxLength()"
      [value]="nativeValue()"
      [disabled]="isDisabled()"
      [required]="isRequired()"
      [readonly]="isReadonly()"
      [autocomplete]="luxAutocomplete()"
      [ngClass]="{
        'lux-number ': isNumber(),
        'lux-number-left': isNumber() && luxNumberAlignLeft()
      }"
      (input)="onInput($event)"
      (blur)="onNativeBlur($event)"
      (focus)="onFocus($event)"
      (focusin)="onFocusIn($event)"
      (focusout)="onFocusOut($event)"
      (keydown)="onKeyDown($event)"
      [luxAriaDescribedby]="describedBy()"
      [luxAriaLabel]="luxAriaLabel()"
      [luxAriaLabelledby]="luxAriaLabelledby()"
      [id]="uid()"
      #input
    />
    @if (inputSuffix()) {
      <span class="lux-input-suffix-container" [attr.aria-disabled]="isDisabled() ? 'true' : null" matSuffix>
        <ng-content select="lux-input-ac-suffix, lux-input-suffix" />
      </span>
    }
    @if (showClearButton()) {
      <span
        class="lux-input-clear-btn-container"
        [attr.aria-disabled]="isDisabled() ? 'true' : null"
        matSuffix
        (mousedown)="onClearMouseDown($event)"
      >
        <lux-button
          class="lux-input-clear-btn"
          [luxIconButton]="true"
          luxIconName="lux-interface-delete-circle"
          [luxLabel]="luxClearAriaLabel() || ('luxc.input.clear.btn.arialabel' | transloco)"
          (luxClicked)="clearInputValue($event)"
        />
      </span>
    }
  </div>
</lux-form-control-wrapper>
