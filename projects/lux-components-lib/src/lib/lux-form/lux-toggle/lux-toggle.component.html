<lux-form-control-wrapper
  [luxFormComponent]="this"
  [luxNoInputRow]="true"
  [luxIgnoreDefaultLabel]="true"
  [luxNoLabels]="luxNoLabels()"
  [luxNoBottomLabel]="luxNoBottomLabel()"
  [luxNoTopLabel]="luxNoTopLabel()"
  luxTagId="luxToggleWrapper"
  (click)="markAsTouched()"
>
  <mat-slide-toggle
    luxTagIdHandler
    class="lux-toggle"
    [luxTagId]="luxTagId()"
    [disableRipple]="true"
    [required]="isRequired()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    (change)="onToggleChange($event)"
    color="primary"
    (focusin)="onFocusIn($event)"
    (focusout)="onFocusOut($event)"
    [id]="uid()"
    [luxAriaDescribedby]="describedBy()"
    luxAriaDescribedbySelector=".mat-slide-toggle-input"
    [luxAriaRequired]="isRequired()"
    luxAriaRequiredSelector=".mat-slide-toggle-input"
    [luxAriaInvalid]="'' + isInvalid()"
    luxAriaInvalidSelector=".mat-slide-toggle-input"
    [luxAriaLabel]="luxAriaLabel()"
    luxAriaLabelSelector="button"
    [luxAriaLabelledby]="luxAriaLabelledby()"
    luxAriaLabelledbySelector="button"
    tabIndex="{{ isReadonly() ? -1 : 0 }}"
    #slidetoggle
  >
    @if (formLabelComponent() || luxLabel()) {
      <span class="lux-form-label">
        @if (luxLabel()) {
          &nbsp;{{ luxLabel() }}&nbsp;
        } @else {
          <!-- Nicht in die nächste Zeile verschieben, sonst bricht das Label an dem Leerzeichen um. -->
          <ng-container *ngTemplateOutlet="formLabelComponent()?.templateRef() ?? null" />
        }
        {{ isRequired() ? '&nbsp;*' : ''
        }}<!-- Nicht in die nächste Zeile verschieben, sonst bricht das Label an dem Leerzeichen um. -->
      </span>
    }
  </mat-slide-toggle>
</lux-form-control-wrapper>
