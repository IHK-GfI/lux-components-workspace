<lux-form-control-wrapper
  (click)="!isDisabled() && !isReadonly() ? timepickerInput.focus() : null"
  [luxFormComponent]="this"
  [luxNoLabels]="luxNoLabels()"
  [luxNoBottomLabel]="luxNoBottomLabel()"
  [luxNoTopLabel]="luxNoTopLabel()"
  [luxLabelLongFormat]="luxLabelLongFormat()"
  luxTagId="luxTimepickerWrapper"
  #timepickerFormControl
>
  <div class="lux-input-row-authentic">
    <input
      matInput
      [luxMatInputError]="showError()"
      luxTagIdHandler
      [luxTagId]="luxTagId()"
      [matTimepicker]="timepicker"
      [matTimepickerMin]="min()"
      [matTimepickerMax]="max()"
      [matTimepickerOpenOnClick]="false"
      [placeholder]="dateMissing() ? ('luxc.timepicker.placeholder.date_required' | transloco) : luxPlaceholder()"
      [disabled]="isDisabled() || dateMissing()"
      [required]="isRequired()"
      [readonly]="isReadonly()"
      [autocomplete]="luxAutocomplete()"
      (valueChange)="onTimeInputValueChange($event)"
      (blur)="luxBlur.emit($event)"
      (focus)="onFocus($event)"
      (focusin)="onFocusIn($event)"
      (focusout)="onFocusOut($event)"
      [id]="uid()"
      [luxAriaDescribedby]="describedBy()"
      [luxAriaLabel]="luxAriaLabel()"
      [luxAriaLabelledby]="luxAriaLabelledby()"
      #timepickerInput
    />
    @if (luxShowToggle()) {
      <mat-timepicker-toggle [disabled]="isDisabled() || isReadonly() || dateMissing()" [for]="timepicker" [disableRipple]="true">
        <lux-icon matTimepickerToggleIcon luxIconName="lux-interface-time-clock-circle" class="lux-timepicker-toggle-icon" />
      </mat-timepicker-toggle>
    }
    <mat-timepicker [interval]="interval()" #timepicker />
  </div>
</lux-form-control-wrapper>
