<lux-form-control-wrapper
  (click)="!isDisabled() && !isReadonly() ? datepickerInput.focus() : null"
  [luxFormComponent]="this"
  [luxNoLabels]="luxNoLabels()"
  [luxNoBottomLabel]="luxNoBottomLabel()"
  [luxNoTopLabel]="luxNoTopLabel()"
  [luxLabelLongFormat]="luxLabelLongFormat()"
  luxTagId="luxDatepickerWrapper"
  #datepickerFormControl
>
  <div class="lux-input-row-authentic">
    <input
      matInput
      luxTagIdHandler
      [luxTagId]="luxTagId()"
      [matDatepicker]="datepicker"
      [min]="min()"
      [max]="max()"
      [matDatepickerFilter]="luxCustomFilter()"
      [placeholder]="luxPlaceholder()"
      [disabled]="isDisabled()"
      [required]="isRequired()"
      [readonly]="isReadonly()"
      [autocomplete]="luxAutocomplete()"
      (dateInput)="onDateChange($event)"
      (blur)="luxBlur.emit($event)"
      (focus)="onFocus($event)"
      (focusin)="onFocusIn($event)"
      (focusout)="onFocusOut($event)"
      [id]="uid()"
      [luxAriaDescribedby]="describedBy()"
      [luxAriaLabel]="luxAriaLabel()"
      [luxAriaLabelledby]="luxAriaLabelledby()"
      #datepickerInput
    />
    @if (luxShowToggle()) {
      <mat-datepicker-toggle [disabled]="isDisabled() || isReadonly()" [for]="datepicker" [disableRipple]="true">
        <lux-icon matDatepickerToggleIcon luxIconName="lux-interface-calendar" class="lux-datepicker-toggle-icon" />
      </mat-datepicker-toggle>
    }
    <mat-datepicker
      [startView]="luxStartView()"
      [startAt]="start()"
      [touchUi]="touchUi()"
      [disabled]="isDisabled() || isReadonly()"
      [panelClass]="'lux-datepicker-panel'"
      [calendarHeaderComponent]="getHeaderByTheme()"
      #datepicker
    />
  </div>
</lux-form-control-wrapper>
