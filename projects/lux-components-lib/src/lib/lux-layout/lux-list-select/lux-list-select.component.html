<ng-template #itemsTpl>
  @for (item of luxItems(); track $index) {
    <lux-list-select-item
      [luxItem]="item"
      [luxMode]="luxMode()"
      [luxSelected]="isSelected(item)"
      [luxDisabled]="luxDisabled() || isItemDisabled(item)"
      [luxLabel]="getLabel(item)"
      [luxSubLabel]="getSubLabel(item)"
      [luxShowDetailButton]="luxShowDetailButton()"
      [luxDetailIconName]="luxDetailIconName()"
      [luxContentTemplate]="contentTemplate() ?? null"
      (luxToggleSelected)="toggleItem(item)"
      (luxDetail)="luxDetailClicked.emit(item)"
    />
  }
</ng-template>

<div class="lux-list-select-viewport">
  @if (luxMode() === 'single') {
    <mat-radio-group class="lux-list-select-list" [attr.aria-label]="listLabel()">
      <ng-container [ngTemplateOutlet]="itemsTpl"></ng-container>
    </mat-radio-group>
  } @else {
    <div class="lux-list-select-list" role="group" [attr.aria-label]="listLabel()">
      <ng-container [ngTemplateOutlet]="itemsTpl"></ng-container>
    </div>
  }
</div>
