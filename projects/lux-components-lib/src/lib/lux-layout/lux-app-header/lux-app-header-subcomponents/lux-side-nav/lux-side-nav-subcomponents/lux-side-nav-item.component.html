<ng-template>
  <div class="lux-side-nav-item-container">
    <!-- Fokus und Tastatur übernimmt der innere lux-button (dessen nativer click blubbert hierher). Der Wrapper
         macht nur zusätzlich die Icons per Maus klickbar; ein eigener Tab-Stopp bzw. keydown-Handler würde
         doppelte Tab-Stopps, doppeltes Umschalten und Scrollen bei der Leertaste verursachen. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="lux-side-nav-item lux-whitespace-nowrap lux-flex lux-place-content-center lux-align-items-center"
      (click)="onClick($event)"
      [ngClass]="{
        'lux-side-nav-item-expandable': luxExpandable(),
        'lux-side-nav-item-selected': luxSelected() && !luxDisabled(),
        'lux-side-nav-disabled': luxDisabled()
      }"
    >
      <lux-icon
        [luxIconName]="luxIconName()"
        luxIconSize="2.5rem"
        luxMargin="0 0 0 0.25rem"
        luxPadding="0.5625rem"
        class="lux-side-nav-item-icon"
        [ngClass]="{ 'lux-side-nav-disabled': luxDisabled() }"
      />

      <lux-button
        [luxLabel]="luxLabel()"
        [luxTagId]="luxTagId()"
        [luxDisabled]="luxDisabled()"
        class="lux-side-nav-item-button lux-flex lux-flex-grow-1 lux-flex-shrink-1 lux-flex-basis-auto"
        [luxAriaExpanded]="luxExpandable() ? luxExpanded() : undefined"
      />

      @if (luxExpandable()) {
        <lux-icon
          class="lux-side-nav-item-expansion-icon lux-flex lux-flex-grow-0 lux-flex-shrink-0 lux-align-self-center"
          luxIconSize="1x"
          [luxIconName]="luxExpanded() ? 'lux-interface-arrows-button-up' : 'lux-interface-arrows-button-down'"
          [ngClass]="{ 'lux-side-nav-disabled': luxDisabled() }"
        />
      }
    </div>
    @if (luxExpanded()) {
      @for (sideNavItem of sideNavItems(); track sideNavItem; let i = $index) {
        @if (i >= 0) {
          <div class="lux-side-nav-sub-item">
            <ng-container [ngTemplateOutlet]="sideNavItem.templateRef() ?? null" />
          </div>
        }
      }
      @if (lastSideNavItem && (lastSideNavItem.sideNavItems().length <= 0 || !lastSideNavItem.luxExpanded())) {
        <div class="lux-side-nav-sub-item-last-child"></div>
      }
    }
  </div>
  <ng-content select="lux-divider" />
</ng-template>
<ng-content select="lux-side-nav-item" />
