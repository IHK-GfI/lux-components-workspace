@if (luxLabel()) {
  <div class="lux-label-container">
    <!-- Text im ng-container ohne Leerraum drumherum, sonst wird der Zeilenumbruch als Leerzeichen vor dem Sternchen gerendert. -->
    <ng-container>{{ luxLabel() }}</ng-container>
    @if (luxShowRequiredMarker()) {
      <span aria-hidden="true">&nbsp;*</span>
    }
  </div>
}
<div class="lux-checkbox-container" [ngClass]="{ 'lux-vertical': luxVertical() }">
  <ng-content />
</div>
