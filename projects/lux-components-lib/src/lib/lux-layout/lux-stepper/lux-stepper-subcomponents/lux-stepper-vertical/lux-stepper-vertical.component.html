<!-- Vertikaler Stepper, die Konfiguration stammt aus dem LuxStepper und wird hier angewandt -->
<mat-vertical-stepper
  [linear]="$safeNavigationMigration(luxStepperConfig()?.luxLinear)"
  [selectedIndex]="$safeNavigationMigration(luxStepperConfig()?.luxCurrentStepNumber)"
  [ngClass]="{
    'lux-ignore-mat-step-icons': $safeNavigationMigration(luxStepperConfig()?.luxUseCustomIcons),
    'lux-pointer-events-none': $safeNavigationMigration(luxStepperConfig()?.luxDisabled),
    'lux-linear-stepper': $safeNavigationMigration(luxStepperConfig()?.luxLinear)
  }"
  [disableRipple]="true"
  (selectionChange)="luxStepChanged.emit($event)"
  (click)="onStepClicked($event)"
  (keydown.enter)="onStepClicked($event)"
  #stepper
>
  @for (luxStep of luxStepperConfig()?.luxSteps; track luxStep; let i = $index) {
    <mat-step [completed]="luxStep.isCompleted()" [optional]="luxStep.luxOptional()" [editable]="luxStep.luxEditable()">
      <!-- Header des Steps -->
      <ng-template matStepLabel>
        <div class="lux-flex lux-place-content-start lux-items-center">
          <ng-template #matStepLabel />
          @if (luxStep.hasHeader) {
            <ng-container *ngTemplateOutlet="luxStep.headerTemplate" />
          }
        </div>
      </ng-template>
      <!-- Content des Steps, wenn Animationen aktiviert sind -->
      <ng-container *ngTemplateOutlet="luxStep.contentTemplate" />
      <!-- Nav-Buttons, wenn aktiviert -->
      @if (luxStepperConfig()?.luxShowNavigationButtons) {
        <lux-stepper-nav-buttons
          [luxIndex]="i"
          [luxStep]="luxStep"
          [luxStepperConfig]="luxStepperConfig()"
          (luxPrevClick)="luxPrevButtonClicked.emit()"
          (luxNextClick)="luxNextButtonClicked.emit()"
          (luxFinClick)="luxFinButtonClicked.emit()"
        />
      }
    </mat-step>
  }

  <!-- Überschreiben der default Material-Icons -->
  <ng-template matStepperIcon="edit">
    <lux-icon luxIconName="lux-interface-edit-pencil" luxIconSize="1.25rem" />
  </ng-template>
  <ng-template matStepperIcon="done">
    <lux-icon luxIconName="lux-interface-validation-check" luxIconSize="1.25rem" />
  </ng-template>
  <ng-template matStepperIcon="error">
    <lux-icon luxIconName="lux-interface-delete-1" luxIconSize="1.25rem" />
  </ng-template>
  <ng-template matStepperIcon="home">
    <lux-icon luxIconName="lux-interface-home-3" luxIconSize="1.25rem" />
  </ng-template>
</mat-vertical-stepper>
