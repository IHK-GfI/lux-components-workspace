<div class="lux-panel" [class.lux-panel-expanded]="accordionTrigger().expanded()" [class.lux-panel-mobile]="mobile">
  <div
    class="lux-expansion-panel-header"
    [class.lux-dynamic-height]="effectiveDynamicHeaderHeight()"
    [style.height]="effectiveDynamicHeaderHeight() ? null : getCurrentHeaderHeight(accordionTrigger().expanded())"
  >
    <button
      ngAccordionTrigger
      luxAutofocus
      type="button"
      [panel]="panel"
      [id]="headerId"
      [disabled]="effectiveDisabled()"
      class="lux-expansion-panel-header-toggle"
      [class.lux-expansion-toggle-indicator-before]="effectiveTogglePosition() === 'before'"
      (click)="panel.toggle()"
    >
      @if (effectiveTogglePosition() === 'before' && !effectiveHideToggle()) {
        <span class="lux-expansion-indicator lux-expansion-indicator-before">
          <lux-icon luxIconName="lux-interface-arrows-button-right" luxIconSize="1x"></lux-icon>
        </span>
      }
      <span class="lux-expansion-panel-header-content lux-flex lux-flex-col">
        <ng-content select="lux-panel-aria-header-title"></ng-content>
        <ng-content select="lux-panel-aria-header-description"></ng-content>
      </span>
      @if (effectiveTogglePosition() === 'after' && !effectiveHideToggle()) {
        <span class="lux-expansion-indicator lux-expansion-indicator-after">
          <lux-icon luxIconName="lux-interface-arrows-button-right" luxIconSize="1x"></lux-icon>
        </span>
      }
    </button>
    <div class="lux-expansion-panel-header-actions">
      <ng-content select="lux-panel-aria-header-custom"></ng-content>
    </div>
  </div>
  <div ngAccordionPanel #panel="ngAccordionPanel" [id]="panelId">
    <ng-template ngAccordionContent>
      <div class="lux-expansion-panel-content">
        <ng-content select="lux-panel-aria-content"></ng-content>
        <ng-content></ng-content>
      </div>
      <ng-content select="lux-panel-aria-action"></ng-content>
    </ng-template>
  </div>
</div>
