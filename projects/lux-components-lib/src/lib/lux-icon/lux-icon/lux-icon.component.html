@if (resolvedIconName()) {
  <mat-icon
    [svgIcon]="resolvedIconName()"
    [ngStyle]="{ padding: luxPadding(), width: luxIconSize(), height: luxIconSize() }"
    [ngClass]="['lux-icon-' + luxColor(), 'lux-icon-on-' + luxColor(), luxRounded() ? 'lux-icon-rounded-' + luxIconSize() : '']"
    class="lux-icon"
  />
}
