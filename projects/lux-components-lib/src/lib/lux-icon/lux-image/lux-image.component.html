<div>
  @if (!luxClickable()) {
    <img
      [src]="resolvedImageSrc()"
      class="lux-image"
      [alt]="luxAlt()"
      [ngStyle]="{ width: luxImageWidth(), height: luxImageHeight() }"
      (error)="onImageError($event)"
    />
  } @else {
    <img
      [src]="resolvedImageSrc()"
      (click)="clicked($event)"
      (keydown.enter)="clicked($event)"
      (keydown.space)="clicked($event)"
      [attr.tabindex]="0"
      class="lux-image lux-clickable"
      [alt]="luxAlt()"
      [ngStyle]="{ width: luxImageWidth(), height: luxImageHeight() }"
      (error)="onImageError($event)"
    />
  }
</div>
